version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: tasklist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasklist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tasklist_pgdata:/var/lib/postgresql/data
    networks:
      - dev-services
volumes:
  tasklist_pgdata:
networks:
  dev-services:
