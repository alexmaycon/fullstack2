spring:
  application:
    name: tasklist
    version: 1.0.0-SNAPSHOT
  profiles:
    active: ${PROFILE:dev}
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${DS_URL:localhost}:${DS_PORT:5432}/${DS_DATABASE:tasklist_db}
    password: ${DS_PASS:postgres}
    username: ${DS_USER:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: 'false'
    hibernate:
      ddl-auto: none
    generate-ddl: 'false'
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: 'health,info,metrics'
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
logging:
  level:
    root: info
    org.springframework.web: info
    br.com.jtech.tasklist: debug
  file:
    name: ./logs/${spring.application.name}.log
springdoc:
  api-docs:
    groups:
      enabled: 'true'
    path: /doc/tasklist/v3/api-documents
  swagger-ui:
    enabled: 'true'
    path: /doc/tasklist/v1/api.html
api:
  version: v1
  description: JTech Tasklist API - User authentication and task management
  url:
    homologation: http://${HOMOLOGATION_SERVER:172.30.1.24}:${HOMOLOGATION_PORT:8081}
    production: ${PRODUCTION_URI:http://${spring.application.name}.jtech.com.br}
jwt:
  secret: ${JWT_SECRET:Y2hhbmdlLW1lLXBsZWFzZS1zdXBlci1zZWNyZXQtY2hhbmdlLW1lLXBsZWFzZS1zdXBlci1zZWNyZXQ=}
  issuer: ${JWT_ISSUER:jtech-tasklist}
  access-expiration-minutes: ${JWT_ACCESS_EXP:60}
  refresh-expiration-minutes: ${JWT_REFRESH_EXP:1440}
